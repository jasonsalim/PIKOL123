<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickleBook — Court Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/controller.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <button type="button" class="brand" data-nav="search" aria-label="Back to search">
          <p class="brand__name">PickleBook</p>
          <p class="brand__tag">Mati City pickleball courts</p>
        </button>
        <nav id="main-nav" class="main-nav" aria-label="Primary">
          <button type="button" class="nav-btn" data-nav="search">Book</button>
          <button type="button" class="nav-btn" data-nav="checkout">Checkout</button>
          <button type="button" class="nav-btn" data-nav="myBookings">My Bookings</button>
          <button type="button" class="nav-btn nav-btn--owner" data-nav="owner">Owner Admin</button>
        </nav>
      </header>

      <div id="summary-view" class="summary-host" aria-live="polite"></div>

      <main id="app" class="app" data-screen="search">
        <div id="search-view" class="screen" data-screen-panel="search"></div>
        <div id="results-view" class="screen" data-screen-panel="results"></div>
        <div id="slot-view" class="screen" data-screen-panel="slot"></div>
        <div id="checkout-view" class="screen" data-screen-panel="checkout"></div>
        <div id="bookings-view" class="screen" data-screen-panel="myBookings"></div>
        <div id="admin-auth-view" class="screen" data-screen-panel="adminAuth"></div>
        <div id="admin-home-view" class="screen" data-screen-panel="adminHome"></div>
        <div id="admin-venue-view" class="screen" data-screen-panel="adminVenue"></div>
        <div id="admin-courts-view" class="screen" data-screen-panel="adminCourts"></div>
        <div id="admin-publish-view" class="screen" data-screen-panel="adminPublish"></div>
        <div id="admin-availability-view" class="screen" data-screen-panel="adminAvailability"></div>
        <div id="admin-bookings-view" class="screen" data-screen-panel="adminBookings"></div>
      </main>

      <footer class="site-footer">
        <p>PickleBook · Vanilla JS MVC</p>
      </footer>
    </div>
  </body>
</html>
